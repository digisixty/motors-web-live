version: "3.8"

services:
  backend:
    image: localhost/mattheos-motors-backend:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MyAppDb: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      MinIO__Endpoint: minio:9000
      MinIO__PublicBaseUrl: ${MINIO_PUBLIC_BASE_URL}
      MinIO__AccessKey: ${MINIO_ROOT_USER}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD}
      MinIO__BucketName: ${MINIO_BUCKET_NAME}
      MinIO__UseSSL: "false"
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__ExpiryMinutes: ${JWT_EXPIRY_MINUTES}
      AdminSettings__Email: ${ADMIN_EMAIL:-administrator@localhost}
      AdminSettings__Password: ${ADMIN_PASSWORD:-Administrator1!}
      Recaptcha__SecretKey: ${BACKEND_RECAPTCHA_V3_SECRET_KEY}
    networks:
      - mattheos-network
    depends_on:
      - postgres
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      placement:
        constraints:
          - node.role == manager
      labels:
        - "com.docker.swarm.imagepullpolicy=never"
      update_config:
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.3

  web-frontend:
    image: localhost/mattheos-motors-web-frontend:latest
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL_WEB}
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${WEB_RECAPTCHA_SITE_KEY}
      NEXT_PUBLIC_CDN_BASE_URL: ${WEB_CDN_BASE_URL}
    volumes:
      - mattheos-web-cache:/app/apps/web/.next/standalone/apps/web/.next/cache
    networks:
      - mattheos-network
    depends_on:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == manager
      labels:
        - "com.docker.swarm.imagepullpolicy=never"

  backoffice-frontend:
    image: localhost/mattheos-motors-backoffice-frontend:latest
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL_BACKOFFICE}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH}
    volumes:
      - mattheos-backoffice-cache:/app/apps/backoffice/.next/standalone/apps/backoffice/.next/cache
    networks:
      - mattheos-network
    depends_on:
      - backend
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == manager
      labels:
        - "com.docker.swarm.imagepullpolicy=never"

  postgres:
    image: postgres:15.2
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - mattheos-db:/var/lib/postgresql/data/
    networks:
      - mattheos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == manager

  minio:
    image: minio/minio:latest
    volumes:
      - mattheos-minio:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001" --address ":9000"
    networks:
      - mattheos-network
    ports:
      - "9001:9001" # MinIO Console - admin access only
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      placement:
        constraints:
          - node.role == manager

  minio-setup:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
    entrypoint: >
      /bin/sh -c "
      /bin/sh -c 'until /usr/bin/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do echo \"Waiting for MinIO...\"; sleep 1; done';
      /usr/bin/mc mb local/$$MINIO_BUCKET_NAME --ignore-existing;
      /usr/bin/mc anonymous set public local/$$MINIO_BUCKET_NAME;
      exit 0;
      "
    networks:
      - mattheos-network
    depends_on:
      - minio
    deploy:
      replicas: 1
      restart_policy:
        condition: none

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    secrets:
      - source: ssl_cert
        target: ssl_cert
      - source: ssl_key
        target: ssl_key
    command: nginx -g 'daemon off;'
    networks:
      - mattheos-network
    depends_on:
      - backend
      - web-frontend
      - backoffice-frontend
      - minio
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
      placement:
        constraints:
          - node.role == manager
      labels:
        - "com.docker.swarm.imagepullpolicy=never"

secrets:
  ssl_cert:
    external: true
  ssl_key:
    external: true

networks:
  mattheos-network:
    driver: overlay
    attachable: true

volumes:
  mattheos-db:
    driver: local
  mattheos-minio:
    driver: local
  mattheos-web-cache:
    driver: local
  mattheos-backoffice-cache:
    driver: local
